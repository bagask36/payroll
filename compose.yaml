services:
  app:
    build:
      context: .
      target: app
    container_name: payroll_juwita_app
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./:/var/www/html
      - storage_data:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - payroll_network

  web:
    build:
      context: .
      target: web
    container_name: payroll_juwita_web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
      - storage_data:/var/www/html/storage:ro
    depends_on:
      - app
    networks:
      - payroll_network

  queue:
    build:
      context: .
      target: app
    container_name: payroll_juwita_queue
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    env_file:
      - .env
    volumes:
      - ./:/var/www/html
      - storage_data:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - payroll_network

  scheduler:
    build:
      context: .
      target: app
    container_name: payroll_juwita_scheduler
    restart: unless-stopped
    command: php artisan schedule:work
    env_file:
      - .env
    volumes:
      - ./:/var/www/html
      - storage_data:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - payroll_network

  postgres:
    image: postgres:16-alpine
    container_name: payroll_juwita_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-payroll_juwita}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-payroll_juwita}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - payroll_network

  redis:
    image: redis:7-alpine
    container_name: payroll_juwita_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - payroll_network

volumes:
  postgres_data:
  redis_data:
  storage_data:

networks:
  payroll_network:
    driver: bridge
